services:
  - type: web
    name: aconoq-php
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SITE_URL
        sync: false
